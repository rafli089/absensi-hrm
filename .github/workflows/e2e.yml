name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: absensi
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/absensi?schema=public
      SESSION_SECRET: ci-test-secret-at-least-32-chars-for-build
      GPS_MAX_ACCURACY_M: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run build
      - name: Start production server
        run: |
          npm run start &
          sleep 5
          # Verifikasi server up
          curl --retry 5 --retry-delay 2 --retry-all-errors http://localhost:3000/api/health
      - run: npm run test:e2e
